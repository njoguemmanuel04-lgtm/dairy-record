<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harvest AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#087747;--green-dark:#064c32;--lime:#b9f276;--bg:#f6f9f6;--text:#17251c;--muted:#66756b;--border:#e3ebe4;--shadow:0 12px 35px rgba(13,63,36,.08);}
*{box-sizing:border-box;margin:0;padding:0;}body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
button,input,select,textarea{font:inherit;}button{cursor:pointer;}a{color:inherit;text-decoration:none;}img{max-width:100%;}.container{width:min(1160px,92%);margin:auto;}.hidden{display:none!important;}
.topbar{background:var(--green-dark);color:white;text-align:center;padding:8px 12px;font-size:12px;}header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--border);backdrop-filter:blur(12px);}
.nav{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:800;color:var(--green-dark);}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;font-weight:600;}
.nav-links{display:flex;align-items:center;gap:24px;}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 19px;border-radius:10px;font-weight:700;font-size:13px;}.btn-primary{background:var(--green);color:white;}.btn-outline{background:white;color:var(--green);border:1px solid #b9d8c4;}.btn-light{background:white;color:var(--green-dark);}.btn-full{width:100%;}.menu-toggle{display:none;}
.hero{position:relative;overflow:hidden;background:#073d2b;color:white;}.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg, rgba(3,39,27,.96) 0%, rgba(3,48,30,.85) 43%, rgba(4,51,30,.25) 100%), url("https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=1800&q=85") center/cover;opacity:.98;}
.hero-inner{position:relative;z-index:1;min-height:510px;display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:30px;padding-top:45px;padding-bottom:45px;}.hero-visual{position:relative;}.hero-photo{width:100%;height:335px;object-fit:cover;border-radius:25px;border:5px solid rgba(255,255,255,.18);}h1{font-size:clamp(37px,5.2vw,64px);line-height:1.08;letter-spacing:-2.2px;}h1 span{color:var(--lime);}section{padding:72px 0;} .section-heading{text-align:center;margin-bottom:30px;} .kicker{color:var(--green);font-size:11px;letter-spacing:1.7px;font-weight:800;text-transform:uppercase;}
.market-tools{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}.search-box{flex:1;min-width:200px;}.search-box input,.market-tools select{width:100%;height:48px;background:white;border:1px solid var(--border);border-radius:10px;padding:0 14px;}
.categories{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px;}.category-btn{border:1px solid var(--border);background:white;border-radius:100px;padding:8px 15px;font-size:12px;font-weight:700;}.category-btn.active{background:var(--green);color:white;}
.crop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:19px;}.crop-card{background:white;border:1px solid var(--border);border-radius:16px;overflow:hidden;}.crop-image{height:170px;position:relative;}.crop-image img{width:100%;height:100%;object-fit:cover;}.crop-tag{position:absolute;top:11px;left:11px;background:white;border-radius:7px;padding:5px 9px;font-size:10px;font-weight:800;}.crop-body{padding:15px;}.crop-price{color:var(--green);font-size:20px;font-weight:800;margin:13px 0 3px;}.crop-location{color:var(--muted);font-size:11px;}.crop-quantity{color:var(--muted);font-size:12px;margin-bottom:14px;}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}.field{display:flex;flex-direction:column;gap:6px;}.field label{font-size:12px;font-weight:700;}.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:9px;padding:12px;width:100%;}.dashboard{background:#eef5ef;}.dashboard-panel{background:white;border:1px solid var(--border);border-radius:20px;padding:25px;max-width:780px;margin:auto;}.form-message{margin-top:14px;font-size:13px;color:var(--green);}
.buyer-layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:25px;}.buyer-box{background:white;border:1px solid var(--border);border-radius:17px;padding:23px;}.saved-item{border-bottom:1px solid var(--border);padding:12px 0;display:flex;justify-content:space-between;}.remove-btn{border:0;background:none;color:#ad4035;font-weight:700;}.muted{color:var(--muted);}
.price-alert{background:#fef2f2;border:1px solid #fecaca;color:#dc2626;padding:8px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-top:8px;}.price-ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a;padding:8px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-top:8px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#133e2a;color:white;padding:12px 20px;border-radius:10px;max-width:90%;font-size:13px;}
@media(max-width:900px){.crop-grid{grid-template-columns:repeat(2,1fr);}}@media(max-width:680px){.menu-toggle{display:block;}.nav-links{display:none;position:absolute;top:67px;left:0;right:0;background:white;padding:17px 5%;flex-direction:column;}.nav-links.open{display:flex;}.crop-grid{grid-template-columns:1fr 1fr;gap:12px;}.form-grid{grid-template-columns:1fr;}.buyer-layout{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="topbar">🌱 47 Counties • Scam Blocker • Full Numbers • Auto Pictures — Free</div>
<header><div class="container nav"><a class="brand" href="#home"><span>🌿</span><span>Harvest AI</span></a><button class="menu-toggle" id="menuToggle">☰</button><nav class="nav-links" id="navLinks"><a href="#marketplace">Marketplace</a><a href="#farmerDashboard" class="btn btn-primary">List Crop</a></nav></div></header>
<main>
<section id="marketplace"><div class="container">
<div class="section-heading"><div class="kicker">Auto pictures + 47 counties + unmasked numbers</div><h2>Find the Crops You Need</h2></div>
<div class="market-tools"><div class="search-box"><input id="cropSearch" type="search" placeholder="🔍 Search crops..."></div><select id="countyFilter"></select></div>
<div class="categories" id="categories"><button class="category-btn active" data-category="All">All Crops</button><button class="category-btn" data-category="Cereals">Cereals</button><button class="category-btn" data-category="Legumes">Legumes</button><button class="category-btn" data-category="Vegetables">Vegetables</button><button class="category-btn" data-category="Fruits">Fruits</button><button class="category-btn" data-category="Tubers">Tubers</button></div>
<div class="crop-grid" id="cropGrid"></div>
</div></section>
<section id="farmerDashboard" class="dashboard"><div class="container"><div class="dashboard-panel">
<h3>🌿 List Your Produce — Auto Picture + Full Number</h3>
<form id="cropForm">
<div class="form-grid">
<div class="field"><label>Crop name *</label><input id="cropName" required placeholder="e.g. Maize, Tomatoes"></div>
<div class="field"><label>Category *</label><select id="cropCategory" required><option value="">Select</option><option>Cereals</option><option>Legumes</option><option>Vegetables</option><option>Fruits</option><option>Tubers</option><option>Other</option></select></div>
<div class="field"><label>Price *</label><input id="cropPrice" type="number" min="1" max="500" required placeholder="120" oninput="validatePrice()"><div id="priceHint"></div></div>
<div class="field"><label>Unit *</label><select id="cropUnit" required onchange="validatePrice()"><option value="per bag">Per bag</option><option value="per kg" selected>Per kg</option><option value="per tonne">Per tonne</option><option value="per crate">Per crate</option><option value="per piece">Per piece</option></select></div>
<div class="field"><label>Quantity *</label><input id="cropQuantity" required placeholder="e.g. 5 bags"></div>
<div class="field"><label>County * (47)</label><select id="cropCounty" required></select></div>
<div class="field"><label>Seller *</label><input id="farmerName" required placeholder="e.g. Emmanuel"></div>
<div class="field"><label>Contact * FULL NUMBER SHOWS</label><input id="farmerContact" required placeholder="e.g. 0116982197"></div>
<div class="field full"><button type="submit" class="btn btn-primary btn-full">Publish → Auto Picture + Full Number</button></div>
</div><p id="formMessage" class="form-message"></p>
</form>
</div></div></section>
<section id="buyerDashboard"><div class="container"><div class="buyer-layout"><div class="buyer-box"><h3>❤️ Saved</h3><div id="savedCrops"></div></div><div class="buyer-box"><h3>📩 Enquiries</h3><div id="buyerEnquiries"></div></div></div></div></section>
</main>
<div id="toast" class="toast hidden"></div>
<script>
const COUNTIES_47=["Baringo","Bomet","Bungoma","Busia","Elgeyo-Marakwet","Embu","Garissa","Homa Bay","Isiolo","Kajiado","Kakamega","Kericho","Kiambu","Kilifi","Kirinyaga","Kisii","Kisumu","Kitui","Kwale","Laikipia","Lamu","Machakos","Makueni","Mandera","Marsabit","Meru","Migori","Mombasa","Murang'a","Nairobi","Nakuru","Nandi","Narok","Nyamira","Nyandarua","Nyeri","Samburu","Siaya","Taita-Taveta","Tana River","Tharaka-Nithi","Trans Nzoia","Turkana","Uasin Gishu","Vihiga","Wajir","West Pokot"];
function getCropImage(name, category){
  const n=(name||"").toLowerCase(); const c=(category||"").toLowerCase();
  if(n.includes("maize")||n.includes("corn")||n.includes("mahindi")) return "https://images.unsplash.com/photo-1551754655-cd27e38d2076?auto=format&fit=crop&w=700&q=80";
  if(n.includes("rice")||n.includes("pishori")) return "https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=700&q=80";
  if(n.includes("bean")||n.includes("maharagwe")) return "https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=700&q=80";
  if(n.includes("tomato")||n.includes("nyanya")) return "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=700&q=80";
  if(n.includes("avocado")) return "https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?auto=format&fit=crop&w=700&q=80";
  if(n.includes("banana")||n.includes("ndizi")) return "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=700&q=80";
  if(n.includes("potato")||n.includes("viazi")) return "https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=700&q=80";
  if(n.includes("kale")||n.includes("sukuma")) return "https://images.unsplash.com/photo-1576045057995-568f588f82fb?auto=format&fit=crop&w=700&q=80";
  if(c.includes("cereal")) return "https://images.unsplash.com/photo-1551754655-cd27e38d2076?auto=format&fit=crop&w=700&q=80";
  if(c.includes("legume")) return "https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=700&q=80";
  if(c.includes("vegetable")) return "https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=700&q=80";
  if(c.includes("fruit")) return "https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?auto=format&fit=crop&w=700&q=80";
  if(c.includes("tuber")) return "https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=700&q=80";
  return "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=700&q=80";
}
function maskPhone(p){ return p; } // UNMASKED - show full number
function validatePrice(){
  const v=parseFloat(document.getElementById("cropPrice").value);
  const unit=document.getElementById("cropUnit").value;
  const hint=document.getElementById("priceHint");
  if(isNaN(v)){hint.innerHTML="";return;}
  if(unit==="per kg"&&v>=500){hint.innerHTML=`<div class="price-alert">❌ BLOCKED: KSh ${v}/kg SCAM! Real 45-80/kg max 200/kg</div>`;}
  else if(v>0){hint.innerHTML=`<div class="price-ok">✓ Good price + full number will show</div>`;}
}
const demoCrops=[
{id:1,name:"Dry Maize",category:"Cereals",price:3500,unit:"per bag",quantity:"50 bags",county:"Kirinyaga",seller:"Demo Farm",contact:"0712345678",image:"https://images.unsplash.com/photo-1551754655-cd27e38d2076?auto=format&fit=crop&w=700&q=80"},
{id:2,name:"Red Beans",category:"Legumes",price:120,unit:"per kg",quantity:"200 kg",county:"Meru",seller:"Demo Farm",contact:"0116982197",image:"https://images.unsplash.com/photo-1515543904379-3d757afe72e4?auto=format&fit=crop&w=700&q=80"},
{id:3,name:"Fresh Tomatoes",category:"Vegetables",price:90,unit:"per kg",quantity:"100 kg",county:"Nakuru",seller:"Demo Farm",contact:"0722123456",image:"https://images.unsplash.com/photo-1546094096-0df4bcaaa337?auto=format&fit=crop&w=700&q=80"},
{id:4,name:"Rice",category:"Cereals",price:160,unit:"per kg",quantity:"300 kg",county:"Kirinyaga",seller:"Demo Farm",contact:"0711223344",image:"https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=700&q=80"},
];
let crops=[...demoCrops]; let activeCategory="All"; let savedCropIds=[]; let enquiries=[];
const cropGrid=document.getElementById("cropGrid"); const searchInput=document.getElementById("cropSearch"); const countyFilter=document.getElementById("countyFilter"); const countySelect=document.getElementById("cropCounty"); const toast=document.getElementById("toast");
function populateCounties(){countyFilter.innerHTML='<option value="">All 47 counties</option>'+COUNTIES_47.map(c=>`<option value="${c}">${c}</option>`).join(""); countySelect.innerHTML='<option value="">Select 47 counties</option>'+COUNTIES_47.map(c=>`<option value="${c}">${c}</option>`).join("");} populateCounties();
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));} function money(v){return"KSh "+Number(v).toLocaleString("en-KE");} function showToast(m){toast.textContent=m;toast.classList.remove("hidden");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.add("hidden"),3000);}
function renderCrops(){const q=searchInput.value.toLowerCase();const co=countyFilter.value.toLowerCase();const filtered=crops.filter(x=>{const cat=activeCategory==="All"||x.category===activeCategory;const query=[x.name,x.county].some(v=>v.toLowerCase().includes(q));const county=!co||x.county.toLowerCase()===co;return cat&&query&&county;}); cropGrid.innerHTML=filtered.map(crop=>`<article class="crop-card"><div class="crop-image"><img src="${escapeHTML(crop.image)}"><span class="crop-tag">${escapeHTML(crop.category)}</span></div><div class="crop-body"><h3>${escapeHTML(crop.name)}</h3><p class="crop-location">📍 ${escapeHTML(crop.county)} • ${escapeHTML(crop.seller)} • ${escapeHTML(crop.contact)}</p><div class="crop-price">${money(crop.price)} <small>${escapeHTML(crop.unit)}</small></div><p class="crop-quantity">${escapeHTML(crop.quantity)}</p><button class="btn btn-outline btn-full" data-save="${crop.id}">Save</button><button class="btn btn-primary btn-full" style="margin-top:8px" data-contact="${crop.id}">Call ${escapeHTML(crop.contact)} 📞</button></div></article>`).join("");}
function renderBuyerActivity(){const saved=crops.filter(c=>savedCropIds.includes(c.id));document.getElementById("savedCrops").innerHTML=saved.map(c=>`<div class="saved-item"><span>${escapeHTML(c.name)} • ${escapeHTML(c.contact)}</span><button class="remove-btn" data-remove="${c.id}">Remove</button></div>`).join("")||'<p class="muted">No saved</p>';document.getElementById("buyerEnquiries").innerHTML=enquiries.map(c=>`<div class="saved-item"><span>${escapeHTML(c.name)} • ${escapeHTML(c.contact)}</span></div>`).join("")||'<p class="muted">No enquiries</p>';}
document.getElementById("categories").addEventListener("click",e=>{const b=e.target.closest("[data-category]");if(!b)return;activeCategory=b.dataset.category;document.querySelectorAll(".category-btn").forEach(i=>i.classList.toggle("active",i===b));renderCrops();});
searchInput.addEventListener("input",renderCrops); countyFilter.addEventListener("change",renderCrops);
cropGrid.addEventListener("click",e=>{const s=e.target.closest("[data-save]");const c=e.target.closest("[data-contact]");if(s){const id=Number(s.dataset.save);savedCropIds=savedCropIds.includes(id)?savedCropIds.filter(x=>x!==id):[...savedCropIds,id];renderCrops();renderBuyerActivity();}if(c){const crop=crops.find(x=>x.id===Number(c.dataset.contact));if(!enquiries.some(x=>x.id===crop.id))enquiries.unshift(crop);renderBuyerActivity();showToast("Full number: "+crop.contact);}});
document.getElementById("savedCrops").addEventListener("click",e=>{const b=e.target.closest("[data-remove]");if(!b)return;savedCropIds=savedCropIds.filter(x=>x!==Number(b.dataset.remove));renderCrops();renderBuyerActivity();});
document.getElementById("cropForm").addEventListener("submit",e=>{e.preventDefault();const priceVal=Number(document.getElementById("cropPrice").value);const unitVal=document.getElementById("cropUnit").value;if(unitVal==="per kg"&&priceVal>=500){document.getElementById("formMessage").style.color="#dc2626";document.getElementById("formMessage").textContent=`❌ BLOCKED SCAM!`;return;}const nameVal=document.getElementById("cropName").value.trim();const catVal=document.getElementById("cropCategory").value;const crop={id:Date.now(),name:nameVal,category:catVal,price:priceVal,unit:unitVal,quantity:document.getElementById("cropQuantity").value.trim(),county:document.getElementById("cropCounty").value.trim(),seller:document.getElementById("farmerName").value.trim(),contact:document.getElementById("farmerContact").value.trim(),image:getCropImage(nameVal,catVal)};crops.unshift(crop);renderCrops();document.getElementById("cropForm").reset();showToast(crop.name+" added — full number "+crop.contact+" shows!");});
const menuToggle=document.getElementById("menuToggle");const navLinks=document.getElementById("navLinks");menuToggle.addEventListener("click",()=>navLinks.classList.toggle("open"));
renderCrops();renderBuyerActivity();
</script>
</body>
</html>
